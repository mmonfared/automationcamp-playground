name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master  # Change this to your default branch if different
  workflow_dispatch:  # Allows manual triggering from the Actions tab

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # Use Node.js 18 LTS
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          # Remove lock file with private Nexus URLs
          rm -f package-lock.json
          # Create .npmrc to force public npm registry
          echo "registry=https://registry.npmjs.org/" > .npmrc
          npm install --legacy-peer-deps
      
      - name: Build Angular app
        run: |
          # Extract repository name for base-href
          REPO_NAME=$(echo ${{ github.repository }} | cut -d'/' -f2)
          npm run build:prod -- --base-href=/$REPO_NAME/
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'  # Angular build output directory
  
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

